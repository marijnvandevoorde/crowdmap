<div class="login-container">
  <div class="login-box">
    <h1>Crowdmap Admin</h1>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" [disabled]="loading()">
        @if (loading()) {
          Logging in...
        } @else {
          Log in
        }
      </button>
    </form>
  </div>
</div>
