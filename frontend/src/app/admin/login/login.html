<div class="login-container">
  <div class="login-box">
    <h1>Crowdmap Admin</h1>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    @if (!mfaStep()) {
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" [disabled]="loading()">
          @if (loading()) {
            Logging in...
          } @else {
            Log in
          }
        </button>
      </form>

      <p class="alt-action">
        Don't have an account? <a routerLink="/admin/register">Create one</a>
      </p>
    } @else {
      <form (ngSubmit)="onVerifyMfa()">
        @if (!useRecovery()) {
          <div class="form-group">
            <label for="code">Authentication code</label>
            <input
              type="text"
              id="code"
              name="code"
              [(ngModel)]="code"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="6-digit code"
              autofocus
            />
          </div>
        } @else {
          <div class="form-group">
            <label for="code">Recovery code</label>
            <input
              type="text"
              id="code"
              name="code"
              [(ngModel)]="code"
              autocomplete="off"
              placeholder="xxxxx-xxxxx"
              autofocus
            />
          </div>
        }

        <button type="submit" [disabled]="loading()">
          @if (loading()) {
            Verifying...
          } @else {
            Verify
          }
        </button>
      </form>

      <p class="alt-action">
        <button type="button" class="link-button" (click)="toggleRecovery()">
          @if (!useRecovery()) {
            Use a recovery code instead
          } @else {
            Use an authenticator code instead
          }
        </button>
      </p>
    }
  </div>
</div>
