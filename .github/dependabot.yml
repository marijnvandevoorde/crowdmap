# Minor + patch updates are grouped into a single PR per ecosystem and are
# merged automatically by .github/workflows/dependabot-auto-merge.yml once the
# PR's other checks pass. Major updates get their own PR for manual review.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the native Go port: it removed the JS compiler API
      # (require('typescript') now exposes only { version, versionMajorMinor }).
      # Angular's compiler-cli and typescript-eslint both cap their peer range
      # at typescript <6.1, and ts-node breaks at runtime. A 6 -> 7 bump cannot
      # be adopted until the toolchain ships TS 7 support. Revisit then.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    allow:
      - dependency-type: "all"
    groups:
      # Framework groups come first so they take precedence over the catch-all.
      # They cover every update type, so an Angular major arrives as one PR
      # (its packages can't build when bumped separately). A grouped PR with a
      # major is reported as semver-major, so it is never auto-merged.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
          - "angular-eslint"
          - "@schematics/angular"
          - "zone.js"
      babel:
        patterns:
          - "@babel/*"
          - "babel-*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # Actions used by the workflows in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # Base images: root Dockerfile + compose, and the frontend image.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Skip PHP pre-releases (alpha/beta/RC); GA and patch releases still come through.
    # Dependabot lowercases docker tags and compares them as Ruby versions, so
    # 8.6.0RC3 becomes 8.6.0.rc3, which falls in [8.6.0.a, 8.6.0). Add a line per next minor.
    ignore:
      - dependency-name: "php"
        versions:
          - ">= 8.6.0.a, < 8.6.0"
          - ">= 8.7.0.a, < 8.7.0"
          - ">= 9.0.0.a, < 9.0.0"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
