services:
  php:
    build: .
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./bin:/app/bin:ro
      - ./database:/app/database

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/app/public:ro
      - ./frontend/dist/frontend/browser:/app/frontend:ro
    depends_on:
      - php
